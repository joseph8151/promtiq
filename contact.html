        <div class="form-field">
          <label for="message">프로젝트 설명</label>
          <textarea id="message" name="message" rows="5" placeholder="프로젝트 배경과 제출 조건을 편하게 남겨주세요."></textarea>
        </div>

        <div class="form-field">
          <label for="materials">보유 자료</label>
          <input type="text" id="materials" name="materials" placeholder="예: 기존 PPT, 회사소개서, RFP, 메모 등">
        </div>

        <div class="form-field">
          <label for="attachment">파일 첨부</label>
          <input type="file" id="attachment" name="attachment">
          <p class="form-hint">보유하신 자료가 있다면 함께 첨부해주세요.</p>
        </div>

        <div class="form-field form-check">
          <input type="checkbox" id="privacy" name="privacy" required>
          <label for="privacy">개인정보는 상담 목적으로만 사용되며, 상담 종료 후 파기됩니다. <span class="req">*</span></label>
        </div>

        <input type="hidden" name="_subject" value="프롬틱 제작 문의">

        <button type="submit" class="btn btn-primary btn-submit">문의 보내기</button>
        <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
