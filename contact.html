<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제작 문의 — 프롬틱 · PROMTIQ</title>
<meta name="description" content="제안서, 기획서, PPT, 기업 문서 제작을 문의하세요. 프롬틱이 확인 후 순서대로 연락드립니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap header-inner">
    <a class="wordmark" href="index.html" aria-label="프롬틱 홈으로">PROMTIQ.</a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <a href="index.html#about">프롬틱</a>

      <a href="services.html#plan">기획서</a>

      <a href="insights.html">인사이트</a>
      <a href="contact.html" class="nav-cta" aria-current="page">제작 문의 →</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="contact-hero">
    <div class="wrap contact-wrap">
      <p class="section-label">제작 문의</p>
      <h1 class="section-title section-title-sm">자료만 보내주세요.</h1>
      <p class="section-desc">현재 상황을 확인한 뒤 구조와 문장부터 정리해드립니다. 확인 후 순서대로 연락드립니다.</p>
    </div>
  </section>

  <section class="section section-tight-top">
    <div class="wrap contact-wrap">
      <form class="contact-form" action="https://formspree.io/f/moeqngev" method="POST" enctype="multipart/form-data">
        <div class="form-row">
          <div class="form-field">
            <label for="company">회사명 <span class="req">*</span></label>
            <input type="text" id="company" name="company" required autocomplete="organization">
          </div>
          <div class="form-field">
            <label for="name">담당자명 <span class="req">*</span></label>
            <input type="text" id="name" name="name" required autocomplete="name">
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="phone">전화번호 <span class="req">*</span></label>
            <input type="tel" id="phone" name="phone" required autocomplete="tel">
          </div>
          <div class="form-field">
            <label for="email">이메일 <span class="req">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
        </div>

        <div class="form-field">
          <label for="service">서비스 선택 <span class="req">*</span></label>
          <select id="service" name="service" required>
            <option value="" disabled selected>선택해주세요</option>
            <option value="public-bid">공공기관 입찰 제안서</option>
            <option value="rfp">기업 RFP 제안서</option>
            <option value="b2b">영업 제안서</option>
            <option value="plan">사업 기획서</option>
            <option value="business-plan">사업계획서</option>
            <option value="ir">IR · 투자자료</option>
            <option value="profile">회사소개서</option>
            <option value="ppt">PPT · 발표자료</option>
            <option value="corporate">기타 기업 문서</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="pages">예상 페이지</label>
            <input type="text" id="pages" name="pages" placeholder="예: 30페이지 내외">
          </div>
          <div class="form-field">
            <label for="deadline">마감일</label>
            <input type="text" id="deadline" name="deadline" placeholder="예: 11월 15일">
          </div>
        </div>

        <div class="form-field">
          <label for="budget">예산</label>
          <select id="budget" name="budget">
            <option value="" disabled selected>선택해주세요</option>
            <option value="50-100">50~100만원</option>
            <option value="100-200">100~200만원</option>
            <option value="200-300">200~300만원</option>
            <option value="300-plus">300만원 이상</option>
            <option value="undecided">협의 필요</option>
          </select>
        </div>

        <div class="form-field">
          <label for="message">프로젝트 설명</label>
          <textarea id="message" name="message" rows="5" placeholder="프로젝트 배경과 제출 조건을 편하게 남겨주세요."></textarea>
        </div>

        <div class="form-field">
          <label for="materials">보유 자료</label>
          <input type="text" id="materials" name="materials" placeholder="예: 기존 PPT, 회사소개서, RFP, 메모 등">
        </div>

        <div class="form-field">
          <label for="attachment">파일 첨부</label>
          <input type="file" id="attachment" name="attachment">
          <p class="form-hint">보유하신 자료가 있다면 함께 첨부해주세요.</p>
        </div>

        <div class="form-field form-check">
          <input type="checkbox" id="privacy" name="privacy" required>
          <label for="privacy">개인정보는 상담 목적으로만 사용되며, 상담 종료 후 파기됩니다. <span class="req">*</span></label>
        </div>

        <input type="hidden" name="_subject" value="프롬틱 제작 문의">

        <button type="submit" class="btn btn-primary btn-submit">문의 보내기</button>
        <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
      </form>

      <p class="contact-direct-light">직접 연락을 원하시면 <a href="mailto:hello@promtiq.kr">hello@promtiq.kr</a>로 메일을 보내주세요.</p>
    </div>
  </section>

</main>

  <div class="wrap footer-inner">
    <div>
      <p class="footer-mark">PROMTIQ.</p>
      <p class="footer-tagline">제안서 · 기획서 · PPT 전문 제작</p>

      <a href="services.html#corporate">기업 문서</a>
      <a href="insights.html">인사이트</a>
      <a href="contact.html">문의하기</a>
    </nav>
  </div>
  <div class="wrap footer-meta">
    <span>hello@promtiq.kr</span>
    <span>&copy; 2026 PROMTIQ</span>
  </div>
</footer>

</body>
</html>
